[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/groshi-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Personal expense tracker"
license = "MIT"
readme = "README.md"
repository = "https://github.com/grondst/groshi"
publish = false

[workspace.dependencies]
groshi-core = { path = "crates/groshi-core" }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "chrono", "migrate", "macros",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
comfy-table = "7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
